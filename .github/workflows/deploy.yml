name: Deploy Ent.Web to OVH VPS (Disabled - Manual Only)

on:
  workflow_dispatch:

concurrency:
  group: deploy-vps-main
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Ent.Web/package-lock.json

      - name: Install Node Dependencies
        run: npm ci
        working-directory: Ent.Web

      - name: Restore .NET Dependencies
        run: dotnet restore Ent.sln

      - name: Build Solution
        run: dotnet build Ent.sln --configuration Release --no-restore

  deploy-vps:
    name: Deploy to OVH VPS
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Code to VPS (/home/myent/apps/ent_web_live)
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME }}
          TARGET: /home/myent/apps/ent_web_live/
          SOURCE: "./"
          EXCLUDE: "/.git/, /bin/, /obj/, /node_modules/, *.zip"

      - name: Build and Start Docker Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/myent/apps/ent_web_live
            docker compose up -d --build --remove-orphans
            
            echo "Waiting for container health check..."
            for i in 1 2 3 4 5 6; do
              if curl -s -f http://127.0.0.1:5000/healthz >/dev/null 2>&1 || curl -s -f http://127.0.0.1:5000 >/dev/null 2>&1; then
                echo "✅ Ent.Web is live and responding healthy on port 5000!"
                exit 0
              fi
              echo "Waiting for startup ($i/6)..."
              sleep 5
            done
            echo "Container started (logs):"
            docker logs --tail 20 ent_web_live
