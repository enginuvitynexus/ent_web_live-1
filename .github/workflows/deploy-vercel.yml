name: Deploy Ent.Web to Vercel

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-vercel-main
  cancel-in-progress: false

jobs:
  # ── Job 1: Build & Validate ──────────────────────────────────
  build-and-validate:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Ent.Web/package-lock.json

      - name: Install Node Dependencies
        run: npm ci
        working-directory: Ent.Web

      - name: Restore .NET Dependencies
        run: dotnet restore Ent.sln

      - name: Build Solution
        run: dotnet build Ent.sln --configuration Release --no-restore

  # ── Job 2: Deploy to Vercel ──────────────────────────────────
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build-and-validate
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (Production)
        run: |
          vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes \
            --prod \
            --build-env ASPNETCORE_ENVIRONMENT=Production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
