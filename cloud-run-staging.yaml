apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ent-web-staging
  labels:
    cloud.googleapis.com/location: asia-southeast1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        # Cloud SQL connection
        run.googleapis.com/cloudsql-instances: PROJECT_ID:asia-southeast1:ent-db
        # Scaling configuration — scale to zero for cost savings
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        # Startup probe
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: github-deployer@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Staging
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: db-connection-staging
            - name: EmailSettings__SmtpPassword
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: smtp-password
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
  traffic:
    - percent: 100
      latestRevision: true
